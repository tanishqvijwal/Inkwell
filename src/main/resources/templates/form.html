<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Tag | Inkwell</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="page-container">

    <h2>Create a Tag</h2>

    <form th:action="@{/tags/save}"
          th:object="${tag}"
          method="post">

        <label for="name">Tag Name</label>

        <input type="text"
               id="name"
               th:field="*{name}"
               placeholder="Enter tag name"
               required>

        <button type="submit">Save Tag</button>

        <a th:href="@{/tags}">Cancel</a>

    </form>

</div>

</body>
</html>
